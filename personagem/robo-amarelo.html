<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô agente — amarelo</title>
<link rel="icon" href="data:,">
<style>
  /* página mínima só para visualizar, no fundo azul-marinho do prompt */
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #1B2240; }
  svg { width: min(80vmin, 440px); height: auto; }
</style>
</head>
<body>

<svg id="robo-svg" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Robô agente amarelo e branco digitando">
  <style>
    /* ---------- cores (variáveis CSS na raiz do svg, para os gradientes herdarem) ----------
       Atenção: não escreva sinais de menor/maior aqui dentro: num SVG embutido no HTML
       o navegador lê este texto como marcação. */
    #robo-svg {
      --robo-branco: #F3F5F8;          /* cabeça */
      --robo-branco-sombra: #C4CAD3;
      --robo-amarelo: #F8C630;         /* tronco, orelhas, punhos, antena */
      --robo-amarelo-claro: #FFE07A;
      --robo-amarelo-escuro: #D8930E;
      --robo-ciano: #5FE6F2;           /* olhos, sorriso, botão do peito */
      --robo-escuro: #353A45;          /* juntas, bases, anéis */
      --robo-cinza: #CBD0D8;           /* braços e base do tronco */
      --robo-cinza-escuro: #9199A5;
      --robo-visor: #0E1016;           /* vidro preto */
    }
    #robo { stroke-linejoin: round; stroke-linecap: round; }

    /* ---------- articulações (coordenadas do viewBox) ---------- */
    #robo g { transform-box: view-box; }
    #antena         { transform-origin: 150px 46px; }   /* base da antena */
    #cabeca         { transform-origin: 150px 182px; }  /* base do pescoço */
    #olho-esq       { transform-origin: 122px 112px; }  /* centro do olho (piscar) */
    #olho-dir       { transform-origin: 178px 112px; }
    #boca           { transform-origin: 150px 140px; }
    #tronco         { transform-origin: 150px 306px; }  /* base apoiada no assento */
    #braco-esq      { transform-origin: 92px 214px; }   /* ombro esquerdo */
    #braco-dir      { transform-origin: 208px 214px; }  /* ombro direito */
    #antebraco-esq  { transform-origin: 70px 254px; }   /* cotovelo esquerdo */
    #antebraco-dir  { transform-origin: 230px 254px; }  /* cotovelo direito */
    #mao-esq        { transform-origin: 100px 288px; }  /* punho esquerdo */
    #mao-dir        { transform-origin: 200px 288px; }  /* punho direito */

    /* ---------- classes ---------- */
    .plastico-branco { fill: url(#grad-branco); stroke: var(--robo-branco-sombra); stroke-width: 1.5; }
    .plastico-amarelo { fill: url(#grad-amarelo); stroke: var(--robo-amarelo-escuro); stroke-width: 1.2; }
    .plastico-cinza  { fill: url(#grad-cinza); stroke: var(--robo-cinza-escuro); stroke-width: 1.2; }
    .junta  { fill: url(#grad-escuro); }
    .realce { fill: none; stroke: #fff; stroke-width: 3; opacity: .8; }
    .rim    { fill: none; stroke: #9FF3FA; stroke-width: 1.6; opacity: .55; }  /* luz de recorte fria */
    .olho   { fill: url(#grad-ciano); filter: url(#brilho); }
    .olho-brilho { fill: #fff; }
    .antena { fill: url(#grad-amarelo); }
    .mao    { fill: url(#grad-cinza); stroke: var(--robo-cinza-escuro); stroke-width: 1.2; }
    .dedo   { fill: none; stroke: var(--robo-escuro); stroke-width: 6; }
  </style>

  <defs>
    <!-- luz no canto superior esquerdo em todos os materiais -->
    <radialGradient id="grad-branco" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" style="stop-color: var(--robo-branco)"/>
      <stop offset="1" style="stop-color: var(--robo-branco-sombra)"/>
    </radialGradient>
    <radialGradient id="grad-amarelo" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" style="stop-color: var(--robo-amarelo-claro)"/>
      <stop offset="0.5" style="stop-color: var(--robo-amarelo)"/>
      <stop offset="1" style="stop-color: var(--robo-amarelo-escuro)"/>
    </radialGradient>
    <linearGradient id="grad-cinza" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F5"/>
      <stop offset="0.5" style="stop-color: var(--robo-cinza)"/>
      <stop offset="1" style="stop-color: var(--robo-cinza-escuro)"/>
    </linearGradient>
    <radialGradient id="grad-escuro" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5A6170"/>
      <stop offset="1" style="stop-color: var(--robo-escuro)"/>
    </radialGradient>
    <!-- vidro preto do visor -->
    <linearGradient id="grad-visor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2B2F3A"/>
      <stop offset="1" style="stop-color: var(--robo-visor)"/>
    </linearGradient>
    <linearGradient id="grad-reflexo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- ciano que brilha (olhos e botão) -->
    <radialGradient id="grad-ciano" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#E6FDFF"/>
      <stop offset="0.45" style="stop-color: var(--robo-ciano)"/>
      <stop offset="1" stop-color="#22B8CC"/>
    </radialGradient>

    <filter id="sombra-contato" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="recorte-visor">
      <rect x="80" y="70" width="140" height="88" rx="22"/>
    </clipPath>
  </defs>

  <g id="robo">

    <!-- ================= ANTENA ================= -->
    <g id="antena">
      <!-- base escura presa na cabeça -->
      <rect x="128" y="38" width="44" height="14" rx="7" class="junta"/>
      <!-- haste cinza -->
      <rect x="145" y="18" width="10" height="24" rx="4" class="plastico-cinza"/>
      <!-- bola amarela -->
      <circle cx="150" cy="16" r="13" class="antena" stroke="var(--robo-amarelo-escuro)" stroke-width="1.2"/>
      <ellipse cx="145" cy="11" rx="4.5" ry="3" fill="#fff" opacity=".8"/>
    </g>

    <!-- ================= CABEÇA ================= -->
    <g id="cabeca">
      <!-- crânio: retângulo bem arredondado, plástico branco brilhante -->
      <g id="cranio">
        <rect x="60" y="48" width="180" height="134" rx="36" class="plastico-branco"/>
        <!-- realce fino na borda superior esquerda -->
        <path d="M70 120 L70 86 Q70 58 98 56 L160 56" class="realce"/>
        <!-- luz de recorte no lado direito -->
        <path d="M235 80 L235 150" class="rim"/>
      </g>

      <!-- visor de vidro preto com reflexo -->
      <g id="visor">
        <rect x="80" y="70" width="140" height="88" rx="22" fill="url(#grad-visor)" stroke="#05060a" stroke-width="1.5"/>
        <g clip-path="url(#recorte-visor)">
          <path d="M80 70 L140 70 L104 158 L80 158 Z" fill="url(#grad-reflexo)"/>
        </g>
        <path d="M96 76 L204 76" stroke="#fff" stroke-width="2" opacity=".25"/>
      </g>

      <!-- olhos ciano grandes com brilho branco -->
      <g id="olho-esq">
        <circle cx="122" cy="112" r="18" class="olho"/>
        <circle cx="116" cy="105" r="5" class="olho-brilho"/>
        <circle cx="129" cy="119" r="2" class="olho-brilho" opacity=".6"/>
      </g>
      <g id="olho-dir">
        <circle cx="178" cy="112" r="18" class="olho"/>
        <circle cx="172" cy="105" r="5" class="olho-brilho"/>
        <circle cx="185" cy="119" r="2" class="olho-brilho" opacity=".6"/>
      </g>

      <!-- sorrisinho ciano -->
      <g id="boca">
        <path d="M141 138 Q150 145 159 138" fill="none" stroke="var(--robo-ciano)" stroke-width="4" filter="url(#brilho)"/>
      </g>

      <!-- orelhas: anel escuro + cilindro amarelo -->
      <g id="orelha-esq">
        <rect x="48" y="84" width="16" height="60" rx="8" class="junta"/>
        <rect x="34" y="90" width="22" height="48" rx="11" class="plastico-amarelo"/>
        <path d="M40 98 L40 116" class="realce" stroke-width="2.5"/>
      </g>
      <g id="orelha-dir">
        <rect x="236" y="84" width="16" height="60" rx="8" class="junta"/>
        <rect x="244" y="90" width="22" height="48" rx="11" class="plastico-amarelo"/>
        <path d="M250 98 L250 116" class="realce" stroke-width="2.5"/>
      </g>
    </g>

    <!-- ================= TRONCO ================= -->
    <g id="tronco">
      <!-- pescoço escuro -->
      <rect x="130" y="176" width="40" height="16" rx="6" class="junta"/>
      <!-- base cinza-clara embaixo do tronco -->
      <rect x="106" y="252" width="88" height="54" rx="22" class="plastico-cinza"/>
      <!-- tronco amarelo arredondado -->
      <path d="M112 188 L188 188 Q206 188 206 208 L204 250 Q202 272 178 274 L122 274 Q98 272 96 250 L94 208 Q94 188 112 188 Z" class="plastico-amarelo"/>
      <!-- linhas de painel (emendas do plástico) -->
      <path d="M150 190 L150 212 M100 214 L128 214 M172 214 L200 214" fill="none" stroke="var(--robo-amarelo-escuro)" stroke-width="1.4" opacity=".7"/>
      <!-- realce e luz de recorte -->
      <path d="M102 244 L101 212 Q101 196 116 195" class="realce"/>
      <path d="M201 212 L199 252" class="rim"/>
      <!-- botão do peito: anel escuro + luz ciano -->
      <circle cx="150" cy="236" r="18" class="junta"/>
      <circle cx="150" cy="236" r="12" class="olho"/>
      <circle cx="146" cy="232" r="3.5" class="olho-brilho" opacity=".85"/>
    </g>

    <!-- ================= BRAÇOS (articulados, à frente, digitando) ================= -->
    <!-- ombro -> cotovelo (braço) | cotovelo -> punho (antebraço) | punho -> garra (mão) -->
    <g id="braco-esq">
      <!-- braço: cápsula cinza com contorno -->
      <path d="M90 216 L70 254" stroke="var(--robo-cinza-escuro)" stroke-width="17" fill="none"/>
      <path d="M90 216 L70 254" stroke="var(--robo-cinza)" stroke-width="14" fill="none"/>
      <path d="M86 220 L71 249" stroke="#fff" stroke-width="3" opacity=".7" fill="none"/>
      <!-- ombro: junta escura -->
      <circle cx="92" cy="214" r="12" class="junta"/>
      <g id="antebraco-esq">
        <path d="M70 254 L98 286" stroke="var(--robo-cinza-escuro)" stroke-width="17" fill="none"/>
        <path d="M70 254 L98 286" stroke="var(--robo-cinza)" stroke-width="14" fill="none"/>
        <path d="M70 252 L91 276" stroke="#fff" stroke-width="3" opacity=".7" fill="none"/>
        <!-- cotovelo -->
        <circle cx="70" cy="254" r="10" class="junta"/>
        <!-- punho amarelo -->
        <rect x="84" y="270" width="28" height="20" rx="8" class="plastico-amarelo" transform="rotate(42 98 280)"/>
        <g id="mao-esq">
          <!-- palma e garra de dois dedos, apontando para o teclado -->
          <circle cx="104" cy="292" r="8" class="mao"/>
          <path d="M100 296 Q96 306 101 311" class="dedo"/>
          <path d="M108 297 Q113 305 110 311" class="dedo"/>
        </g>
      </g>
    </g>

    <g id="braco-dir">
      <path d="M210 216 L230 254" stroke="var(--robo-cinza-escuro)" stroke-width="17" fill="none"/>
      <path d="M210 216 L230 254" stroke="var(--robo-cinza)" stroke-width="14" fill="none"/>
      <path d="M212 220 L226 247" stroke="#fff" stroke-width="3" opacity=".6" fill="none"/>
      <circle cx="208" cy="214" r="12" class="junta"/>
      <g id="antebraco-dir">
        <path d="M230 254 L202 286" stroke="var(--robo-cinza-escuro)" stroke-width="17" fill="none"/>
        <path d="M230 254 L202 286" stroke="var(--robo-cinza)" stroke-width="14" fill="none"/>
        <path d="M226 254 L206 277" stroke="#fff" stroke-width="3" opacity=".6" fill="none"/>
        <circle cx="230" cy="254" r="10" class="junta"/>
        <rect x="188" y="270" width="28" height="20" rx="8" class="plastico-amarelo" transform="rotate(-42 202 280)"/>
        <g id="mao-dir">
          <circle cx="196" cy="292" r="8" class="mao"/>
          <path d="M200 296 Q204 306 199 311" class="dedo"/>
          <path d="M192 297 Q187 305 190 311" class="dedo"/>
        </g>
      </g>
    </g>

    <!-- ================= SOMBRA DE CONTATO ================= -->
    <!-- abaixo da base (y 306), então não cobre o robô mesmo sendo o último elemento -->
    <ellipse id="sombra" cx="150" cy="326" rx="74" ry="11" fill="#000" opacity=".35" filter="url(#sombra-contato)"/>
  </g>
</svg>

</body>
</html>
